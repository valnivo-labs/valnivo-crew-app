<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Valnivo Crew has control</title>
<style>
  html,body{margin:0;height:100%;background:#b3261e;color:#fff;font:600 14px/1.3 -apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
  .b{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;box-sizing:border-box;text-align:center}
  .d{width:10px;height:10px;border-radius:50%;background:#fff;flex:none;animation:p 1.2s ease-in-out infinite}
  @keyframes p{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.d{animation:none}}
</style></head>
<body><div class="b" role="alert"><span class="d" aria-hidden="true"></span><span id="t">The crew is controlling this computer</span></div>
<script>
  // Kabil 17 Nov: the warning the app keeps on top of every window while a crew agent has control (control.rs)
  // 0.14.0 (input_guard.rs): mode=handsoff while the person's mouse and keyboard are paused; released once hands-off gave them back
  var q = new URLSearchParams(location.search), who = q.get("who") || "A crew agent", until = q.get("until") || "", mode = q.get("mode") || "";
  var head = who + " is controlling this computer" + (until ? " until " + until : "") + ". ";
  document.getElementById("t").textContent = mode === "handsoff" ? "Hands-off: your mouse and keyboard are paused. Press Esc 3 times to take back control."
    : mode === "released" ? head + "Hands-off ended (no action for 10 minutes): your mouse and keyboard work again."
    : head + "It waits while you use the mouse or keyboard. Mouse to the top-left corner to stop.";
</script></body></html>
